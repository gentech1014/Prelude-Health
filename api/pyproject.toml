[project]
name = "prelude-health-api"
version = "0.1.0"
description = "AI pre-screening voice agent for primary care intake calls"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Pinned, not floating: `strands.experimental.bidi` is experimental
    # upstream and has already broken once here. 1.44.0 does NOT work --
    # its Nova Sonic provider imports `BedrockRuntimeClient`, which
    # aws-sdk-bedrock-runtime 0.11.0 renamed to `AsyncBedrockRuntimeClient`,
    # so importing the model raises ImportError at startup. 1.54.0 is the
    # version every bidi call site here was verified against by
    # introspecting the installed package -- notably that BidiAgent.run()
    # calls start() and stops the agent itself. Re-verify before bumping.
    "strands-agents[bidi]==1.54.0",
    "boto3>=1.35",
    "motor>=3.6",
    "structlog>=24.4",
    "typer>=0.13",
    "httpx>=0.27",
    "google-api-python-client>=2.149",
    "google-auth>=2.35",
    # HTML/CSS -> PDF report rendering. Playwright bundles its own Chromium
    # (no Pango/Cairo/GTK system libs to install, unlike WeasyPrint), which is
    # what lets the report template use real CSS grid/flexbox/colour layout
    # instead of hand-built ReportLab tables. See `app.services.report_pdf`.
    "jinja2>=3.1",
    "markupsafe>=2.1",
    "playwright>=1.47",
    # Merges/embeds a patient-uploaded supporting document into the
    # generated report PDF (as an embedded file attachment).
    "pypdf>=5.0",
    # The IANA timezone database. Windows and slim Linux images ship none,
    # and `zoneinfo` then fails on every key -- including "UTC" -- so the
    # clinic's configured timezone would never resolve without this.
    "tzdata>=2024.2",
    "moss>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "ty>=0.0.77",
    "pre-commit>=4.0",
    "mongomock-motor>=0.0.34",
    "moto[s3]>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/app"]
omit = ["*/__pycache__/*"]

[tool.ty.environment]
python-version = "3.12"
python = ".venv"
