stages:
  - build
  - deploy

variables:
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  AWS_DEFAULT_REGION: "ap-south-1"

build:
  stage: build
  image: docker:27

  services:
    - name: docker:27-dind
      command: ["--tls=false"]

  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

  before_script:
    - 'echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin'

  script:
    - 'echo "Building Docker image..."'
    - 'docker build -f Dockerfile -t "$DOCKER_IMAGE" .'
    - 'echo "Pushing Docker image..."'
    - 'docker push "$DOCKER_IMAGE"'
    - 'echo "Build completed successfully"'

deploy:
  stage: deploy
  image:
    name: amazon/aws-cli:2.27.47
    entrypoint: [""]

  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

  script:
    - 'echo "Checking AWS credentials..."'
    - 'aws sts get-caller-identity'
    - 'echo "Deploying $DOCKER_IMAGE to EC2..."'
    - 'COMMAND_ID=$(aws ssm send-command --region "$AWS_DEFAULT_REGION" --instance-ids "$EC2_INSTANCE_ID" --document-name "AWS-RunShellScript" --comment "GitLab deployment - $CI_COMMIT_SHA" --parameters "commands=[\"echo Starting deployment...\",\"echo $CI_REGISTRY_PASSWORD | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin\",\"mkdir -p /opt/prelude-health-api/deployment\",\"cd /opt/prelude-health-api/deployment\",\"export IMAGE=$DOCKER_IMAGE\",\"docker compose pull\",\"docker compose up -d --remove-orphans\",\"docker image prune -f\",\"docker ps\",\"echo Deployment completed successfully\"]" --query "Command.CommandId" --output text)'
    - 'echo "SSM Command ID: $COMMAND_ID"'
    - 'aws ssm wait command-executed --region "$AWS_DEFAULT_REGION" --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"'
    - 'aws ssm get-command-invocation --region "$AWS_DEFAULT_REGION" --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"'